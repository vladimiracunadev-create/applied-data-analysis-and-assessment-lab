name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pruebas (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked, no --upgrade: falla si uv.lock está desincronizado de pyproject.toml,
      # en lugar de resolver dependencias nuevas en silencio. Sin esto, cada cambio de
      # versión del proyecto hacía que CI instalara versiones distintas de las
      # probadas en local, y las pruebas fallaban por una obsolescencia que nadie
      # había visto.
      - name: Preparar el entorno (dependencias fijadas)
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Generar los datos sintéticos
        run: uv run python scripts/generate_data.py

      - name: Ejecutar la suite de pruebas
        run: uv run python -m pytest

  # Canario de dependencias: resuelve las versiones más nuevas compatibles y corre la
  # suite. El filtro de advertencias del proyecto convierte las obsolescencias de
  # `lab.*` en errores, de modo que este trabajo avisa de un cambio en pandas antes de
  # que rompa nada. No bloquea la publicación: informa.
  dependencias-al-dia:
    name: Canario de dependencias
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Resolver las versiones más nuevas compatibles
        run: uv sync --upgrade

      - name: Versiones instaladas
        run: uv run python -c "import pandas, numpy; print('pandas', pandas.__version__); print('numpy', numpy.__version__)"

      - name: Generar los datos sintéticos
        run: uv run python scripts/generate_data.py

      - name: Ejecutar la suite de pruebas
        run: uv run python -m pytest

  coherence:
    name: Coherencia del repositorio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Preparar el entorno (dependencias fijadas)
        run: uv sync --locked

      # Se comprueba sobre el checkout inmutable, antes de que cualquier generador
      # reescriba CSV o binarios con detalles propios del runtime o del sistema.
      - name: Comprobar el paquete general de casos
        run: uv run python scripts/build_all_cases.py --check

      - name: Generar los datos sintéticos
        run: uv run python scripts/generate_data.py

      # Cada comando que el README promete debe funcionar. Un README con un comando
      # roto es una afirmación falsa sobre el repositorio.
      - name: Verificar el arnés de contratos de agentes
        run: uv run python -m lab.agents

      - name: Verificar el estándar de las clases
        run: uv run python -m lab.learning

      - name: Verificar la base de conocimiento
        run: uv run python -m lab.knowledge

      - name: Construir los libros de Excel resueltos
        run: uv run python scripts/build_excel_solutions.py

      - name: Construir una simulación reproducible
        run: uv run python scripts/build_assessment.py --blueprint gestor-datos-transporte --seed 1

      - name: Comprobar que la documentación derivada está al día
        run: uv run python scripts/build_docs.py --check

      - name: Comprobar la solución de referencia en Pandas
        run: uv run python solutions/reference.py 1

      - name: Comprobar la segunda implementación en SQL
        run: uv run python solutions/sql_reference.py 1

  multitecnologia:
    name: Validación Polars y R
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Instalar paquetes R de procesamiento y visualización
        run: Rscript -e "install.packages(c('readr', 'dplyr', 'ggplot2'), repos='https://cloud.r-project.org')"

      - name: Preparar Python con Polars opcional
        run: uv sync --locked --extra polars

      - name: Generar los datos sintéticos
        run: uv run python scripts/generate_data.py

      - name: Confirmar que ambos motores están disponibles
        run: |
          Rscript --version
          uv run --extra polars python -c "import polars; print('polars', polars.__version__)"

      - name: Confrontar Pandas, Polars y R
        run: uv run --extra polars python -m pytest tests/test_multiengine.py

  lint:
    name: Estilo (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Ejecutar ruff
        run: uvx ruff check .
